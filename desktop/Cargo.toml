[package]
name = "hp-charge-limit-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Optional desktop client: never part of a core CLI build.
[workspace]

[features]
default = []
tray = ["dep:ksni", "dep:tray-icon"]

[dependencies]
hp-charge-limit-protocol = { path = "../protocol" }
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"], optional = true }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.21", optional = true }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "hp-charge-limit-tray"
path = "src/main.rs"
required-features = ["tray"]
