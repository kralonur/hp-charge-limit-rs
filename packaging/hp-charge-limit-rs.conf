# hp-charge-limit-rs daemon settings, read by hp-charge-limit-rs.service.
# Uncomment to change a default, then: sudo systemctl restart hp-charge-limit-rs
# (`hp-charge-limit-rs daemon --help` describes each option.)

# Charge band while running: stop at or above STOP %, resume at or below START %
#HP_CHARGE_LIMIT_RS_STOP=50
#HP_CHARGE_LIMIT_RS_START=40
#HP_CHARGE_LIMIT_RS_INTERVAL=30

# Mode at STOP while running: inhibit (white LED) or hold (orange LED)
#HP_CHARGE_LIMIT_RS_RUN_MODE=inhibit

# Mode set at shutdown/reboot: hold, inhibit, auto or keep;
# at or below OFF_MIN % auto is used instead (charges while off)
#HP_CHARGE_LIMIT_RS_OFF_MODE=hold
#HP_CHARGE_LIMIT_RS_OFF_MIN=40

# Mode set when only the service is stopped: auto (stock), inhibit, hold or keep
#HP_CHARGE_LIMIT_RS_STOP_MODE=auto
