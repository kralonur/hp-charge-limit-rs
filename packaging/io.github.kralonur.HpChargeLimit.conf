<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only root (the daemon) may own the name that sends charge-limit signals,
     so notifiers matching on it cannot be spoofed by other users. Everyone
     may receive the signals; no methods are exposed. -->
<busconfig>
  <policy user="root">
    <allow own="io.github.kralonur.HpChargeLimit"/>
  </policy>
</busconfig>
